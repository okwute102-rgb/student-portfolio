<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Student Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="planner.html">Academic Planner</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2>Contact Me</h2>
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name">
                <small class="error" id="nameError"></small>
            </div>
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="text" id="email">
                <small class="error" id="emailError"></small>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="text" id="phone">
                <small class="error" id="phoneError"></small>
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" rows="4"></textarea>
                <small class="error" id="messageError"></small>
            </div>
            <button type="submit">Send Message</button>
            <p id="successMessage" class="success"></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Student Portfolio. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
